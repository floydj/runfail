name: Ruby

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec ruby -I test test/all_test.rb
      - run: bundle exec rubocop
      - run: gem build rails-test-rerun.gemspec
